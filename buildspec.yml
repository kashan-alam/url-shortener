version: 0.2

phases:

  install:
    runtime-versions:
      python: 3.11
    commands:
      - echo "Installing dependencies..."
      - pip install pytest boto3 requests flask

  pre_build:
    commands:
      - echo "Running unit tests..."
      - pytest tests/ -v
      - echo "Logging into ECR..."
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ECR_URI

  build:
    commands:
      - echo "Building Docker image..."
      - docker build -t $ECR_URI:latest ./frontend
      - docker push $ECR_URI:latest
      - echo "Packaging Lambda functions..."
      - cd lambdas/shorten && zip -r ../../shorten.zip . && cd ../..
      - cd lambdas/redirect && zip -r ../../redirect.zip . && cd ../..
      - echo "Deploying Lambda code..."
      - aws lambda update-function-code --function-name url-shortener-shorten --zip-file fileb://shorten.zip
      - aws lambda update-function-code --function-name url-shortener-redirect --zip-file fileb://redirect.zip
      - echo "Creating or updating ECS service..."
      - |
        SERVICE_EXISTS=$(aws ecs describe-services --cluster $ECS_CLUSTER --services $ECS_SERVICE --query "services[?status=='ACTIVE'].serviceName" --output text)
        if [ -z "$SERVICE_EXISTS" ]; then
          echo "Creating ECS service for first time..."
          aws ecs create-service \
            --cluster $ECS_CLUSTER \
            --service-name $ECS_SERVICE \
            --task-definition $TASK_DEF_FAMILY \
            --desired-count 1 \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNET_ID],securityGroups=[$SECURITY_GROUP_ID],assignPublicIp=ENABLED}"
        else
          echo "Updating existing ECS service..."
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE \
            --task-definition $TASK_DEF_FAMILY \
            --force-new-deployment
        fi

  post_build:
    commands:
      - echo "Build complete."

artifacts:
  files:
    - "**/*"