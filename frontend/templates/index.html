<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>URL Shortener</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 80px auto; padding: 0 20px; }
    input[type=text] { width: 100%; padding: 10px; font-size: 16px; box-sizing: border-box; }
    button { padding: 10px 24px; background: #4f46e5; color: white; border: none; font-size: 16px; cursor: pointer; border-radius: 4px; margin-top: 10px; }
    .result { margin-top: 24px; padding: 16px; background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 6px; }
    .error  { margin-top: 24px; padding: 16px; background: #fef2f2; border: 1px solid #fecaca; border-radius: 6px; }
    a { color: #4f46e5; }
  </style>
</head>
<body>
  <h1>URL Shortener</h1>
  <p>Paste a long URL below and get a short link.</p>

  <form method="POST" action="/shorten">
    <input type="text" name="url" placeholder="https://example.com/very/long/url" required>
    <br>
    <button type="submit">Shorten</button>
  </form>

  {% if short_url %}
  <div class="result">
    <p>Short URL: <a href="{{ short_url }}" target="_blank">{{ short_url }}</a></p>
    <p>Original: {{ original_url }}</p>
  </div>
  {% endif %}

  {% if error %}
  <div class="error">
    <p>Error: {{ error }}</p>
  </div>
  {% endif %}
</body>
</html>
